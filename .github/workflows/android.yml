name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Build, test, lint and minified release
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease --stacktrace
      - name: Verify R8 mapping
        run: |
          test -s app/build/outputs/mapping/release/mapping.txt
          test "$(wc -c < app/build/outputs/mapping/release/mapping.txt)" -gt 100
          echo "R8 mapping generated successfully."
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: app/build/reports/
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: SmartVault-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - name: Upload minified release AAB
        uses: actions/upload-artifact@v4
        with:
          name: SmartVault-release-ci-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartVault-debug
          path: app/build/outputs/apk/debug/*.apk
